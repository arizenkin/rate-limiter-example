services:
  app:
    build:
      context: .
      target: runtime
    # Bound to loopback: /ratelimit is unauthenticated by design (HLD decision 11), so keep this
    # on a trusted network or behind a proxy.
    ports:
      - '127.0.0.1:3000:3000'
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }
    environment:
      LOG_LEVEL: info
      # SHA-256 hex digest(s) of the admin API key(s); generate with `pnpm gen-key`.
      # Required: the service refuses to start without it (see README). Left unset here so that
      # `docker compose --profile test run test` works without a key.
      ADMIN_API_KEYS: ${ADMIN_API_KEYS:-}
      # Keep below Docker's stop timeout (10 s by default, `stop_grace_period`), or SIGKILL wins.
      SHUTDOWN_GRACE_MS: 5000
    # Mount your own seed file with: -v ./config:/app/config:ro

  # `docker compose run --rm test` runs lint + unit tests inside the container.
  test:
    build:
      context: .
      target: build
    profiles: ['test']
    command: sh -c "pnpm lint && pnpm test"
